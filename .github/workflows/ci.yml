# The quality gate (`npm run check`, what the pre-push hook runs) and the fixture-tier
# end-to-end suite. Both need nothing outside this repository: the dashboards run on
# the committed fixtures.
name: ci

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --ignore-scripts
            # The unit suite's browser project drives the installed Chrome.
            - run: npx playwright install --with-deps chrome
            - run: npm run check

    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npx playwright install --with-deps chrome
            - run: npm run test:e2e
