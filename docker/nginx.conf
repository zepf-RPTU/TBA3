# Serves dist/ and keeps the API same-origin under /api/ — the deployment counterpart
# of the Vite dev/preview proxy in vite.config.js.

# $content_security_policy comes from csp.conf beside this file, which the image build
# writes from config/csp.mjs (docker/csp-conf.mjs).

# Hashed bundles never change under the same name; everything else (pages, data/,
# NOTICE) is revalidated on every load, so a deploy is seen at once. The API sets its own
# caching, and an empty value adds no header.
map $uri $cache_control {
    ~^/(docs/)?assets/ "public, max-age=31536000, immutable";
    ~^/api/ "";
    default "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Every header is set here, at server level, and no location sets its own: nginx
    # drops all inherited add_header directives in a location that has one.
    # No HSTS: this container speaks plain HTTP behind whatever terminates TLS, and
    # that is where HSTS belongs.
    add_header Content-Security-Policy $content_security_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $cache_control always;

    # The stock image compresses nothing; the dataset JSON shrinks about 25-fold. The
    # static files are compressed once, at image build (Dockerfile): gzip_static serves
    # their .gz siblings. On-the-fly gzip stays for /api/ and any file without one.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # The upstream is resolved per request, not at startup: the public stack
    # (compose.yaml) has no `api` container, and a literal `proxy_pass http://api:8000/`
    # would keep nginx from booting at all. With the variable, a missing API is a 502
    # on /api/ and nothing else. The rewrite replaces the prefix strip that a
    # trailing-slash proxy_pass does implicitly — a variable proxy_pass does not.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Directory URLs (/en/) resolve to the page; a wrong path is a 404, not the chooser.
    location / {
        gzip_static on;
        try_files $uri $uri/ =404;
    }
}
