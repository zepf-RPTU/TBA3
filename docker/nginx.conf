# Serves dist/ and keeps the API same-origin under /api/ — the deployment counterpart
# of the Vite dev/preview proxy in vite.config.js.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The upstream is resolved per request, not at startup: the public stack
    # (compose.yaml) has no `api` container, and a literal `proxy_pass http://api:8000/`
    # would keep nginx from booting at all. With the variable, a missing API is a 502
    # on /api/ and nothing else. The rewrite replaces the prefix strip that a
    # trailing-slash proxy_pass does implicitly — a variable proxy_pass does not.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Directory URLs (/en/) resolve to the page; a wrong path is a 404, not the chooser.
    location / {
        try_files $uri $uri/ =404;
    }
}
